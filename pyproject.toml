[project]
name = "plankapy"
version = "2.4.0"

# Contributors can add their info here
authors = [
  { name = "Hayden Welch", email = "hwelch@finelines-engineering.com" },
]

description = "A Python interface for Plankanban"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["plankapy*"]

[dependency-groups]
cli = [
    "typer>=0.21.1",
]
dev = [
    "hypothesis>=6.151.4",
    "pytest>=9.0.2",
]

[project.urls]
Homepage = "https://github.com/hwelch-fle/plankapy"
Documentation = "https://hwelch-fle.github.io/plankapy/plankapy.html"
Issues = "https://github.com/hwelch-fle/plankapy/issues"
Discussions = "https://github.com/hwelch-fle/plankapy/discussions"



[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"*/__init__.py" = ["F403"] # Allow * imports for __init__ (Ensure that __all__ is defined in target)
"src/plankapy/v2/models/*" = ["E402"] # Defer imports for models

[tool.ruff.lint]
ignore = [
    "RUF001", # ruff-specific rules ambiguous-unicode-character-string
    "S101",   # flake8-bandit assert
    "S308",   # flake8-bandit suspicious-mark-safe-usage
    "S603",   # flake8-bandit subprocess-without-shell-equals-true
    "S607",   # flake8-bandit start-process-with-partial-path
    "E501",   # pycodestyle line-too-long
    "PTH123",
]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "E",   # pycodestyle errors
    "EXE", # flake8-executable
    "F",   # pyflakes
    "I",   # isort
    "INT", # flake8-gettext
    "PIE", # flake8-pie
    "PLC", # pylint convention
    "PLE", # pylint errors
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RSE", # flake8-raise
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
# force-single-line = true
force-wrap-aliases = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
indent-style = "space"
